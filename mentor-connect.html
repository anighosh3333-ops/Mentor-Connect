<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FC;--surface:#fff;--ink:#14213D;--muted:#57647F;--line:#D9E0EE;--brand:#2446E8;--on-brand:#fff;--hi:#FFCB3D;--ok:#0F7A49;--bad:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1424;--surface:#172038;--ink:#EAF0FF;--muted:#A0ACCB;--line:#2B3757;--brand:#8AA0FF;--on-brand:#0D1424;--ok:#4FD19A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0D1424;--surface:#172038;--ink:#EAF0FF;--muted:#A0ACCB;--line:#2B3757;--brand:#8AA0FF;--on-brand:#0D1424;--ok:#4FD19A;--bad:#FF8A80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.1}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
.logo{font-size:22px;font-weight:800;margin-right:auto}
.logo i{display:inline-block;width:14px;height:14px;background:var(--hi);border-radius:50%;margin-right:8px;box-shadow:6px 0 0 -2px var(--brand)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.bellw{position:relative}
#bell{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer}
#bell b{background:var(--hi);color:#14213D;border-radius:999px;padding:0 7px;margin-left:8px;font-size:13px}
#panel{position:absolute;right:0;top:46px;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(20,33,61,.2);display:none}
#panel.open{display:block}
#panel p{margin:0;padding:10px;border-bottom:1px solid var(--line);font-size:15px}
#panel p:last-child{border:0}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
nav button.on{color:var(--ink);border-color:var(--brand)}
.hero{padding:44px 0 20px}
.hero h1{font-size:clamp(34px,6vw,60px);font-weight:800;max-width:15em;letter-spacing:-.02em}
.hero p{color:var(--muted);max-width:36em;margin:14px 0 24px;font-size:18px}
.search{display:block;width:100%;max-width:640px;padding:16px 18px;font-size:18px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:6px 6px 0 var(--hi)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding-bottom:40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.card h3{font-size:19px}
.sub{color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:13px}
.bio{margin:0;font-size:15px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.btn{border:0;background:var(--brand);color:var(--on-brand);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted)}
.sec{padding:30px 0 50px}
.sec h2{font-size:30px;margin-bottom:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px}
.row h3{font-size:18px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;border:1px solid currentColor}
.pending{color:var(--muted)}.accepted{color:var(--brand)}.completed{color:var(--ok)}.declined{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);width:min(460px,92vw);padding:22px}
dialog::backdrop{background:rgba(10,15,30,.55)}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:14px}
input.f,textarea.f,select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0 0}
.stars{display:flex;gap:4px}
.stars button{font-size:28px;background:none;border:0;cursor:pointer;color:var(--line);padding:0 2px}
.stars button.on{color:#E0A100}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="bar">
    <div class="logo"><i></i>Mentor Connect</div>
    <div class="seg" id="seg" role="group" aria-label="View as"></div>
    <div class="bellw"><button id="bell" onclick="togglePanel()" aria-label="Notifications"></button><div id="panel"></div></div>
  </div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="main"></main>
<footer><div class="wrap">Working prototype: everything you do here lives on this page only. Real sign-in, a database and email alerts come with the backend build.</div></footer>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const M=[
{id:1,n:"Priya Raman",t:"Senior Software Engineer",c:"Technical",s:["React","TypeScript","System design"],y:9,r:4.9,b:"Ships production web apps. Reviews your code, plans projects and preps you for technical interviews.",a:"Weekday evenings"},
{id:2,n:"Dr. Karthik Subramanian",t:"Associate Professor, Physics",c:"Academic",s:["Research methods","Thesis writing","Physics"],y:16,r:4.8,b:"Guides undergraduates through their first research project and final-year thesis.",a:"Saturdays"},
{id:3,n:"Meera Iyer",t:"Product Manager",c:"Career",s:["Resume review","Interview prep","Product management"],y:7,r:4.7,b:"Helps you turn projects into a resume that gets replies, then practise the interview.",a:"Sunday mornings"},
{id:4,n:"Sana Qureshi",t:"Data Scientist",c:"Technical",s:["Python","Machine learning","SQL"],y:6,r:4.8,b:"Walks you from messy data to a model you can explain, with a focus on fundamentals.",a:"Weekday evenings"},
{id:5,n:"Vikram Nair",t:"Freelance Designer",c:"Skills",s:["UI design","Figma","Portfolio"],y:8,r:4.6,b:"Gives direct feedback on your designs and helps you build a portfolio worth showing.",a:"Flexible"},
{id:6,n:"Anjali Menon",t:"Career Coach",c:"Career",s:["Internships","Networking","LinkedIn"],y:11,r:4.9,b:"Helps first-time job seekers find internships and write outreach messages people answer.",a:"Weekends"},
{id:7,n:"Rahul Deshmukh",t:"Chartered Accountant",c:"Skills",s:["Finance basics","Excel","Public speaking"],y:12,r:4.5,b:"Teaches practical money and spreadsheet skills, and coaches you to present with confidence.",a:"Weekday evenings"},
{id:8,n:"Lakshmi Narayanan",t:"Mathematics Lecturer",c:"Academic",s:["Calculus","Statistics","Exam strategy"],y:14,r:4.8,b:"Breaks hard maths topics into steps and builds an exam plan around your weak spots.",a:"Saturdays"}
];
const CATS=["All","Academic","Technical","Career","Skills"];
let role="student",mentorAs=1,view="find",q="",cat="All",nid=2,stars=0;
let reqs=[{id:1,m:1,by:"Arjun K.",topic:"Review my React portfolio project",msg:"I built a task tracker and want feedback on structure and state handling.",when:"Any evening this week",st:"pending"}];
let notes=[{to:"m1",t:"Arjun K. sent you a request: Review my React portfolio project",read:false}];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mm=id=>M.find(x=>x.id===id);
const ini=n=>n.replace(/^Dr\. /,"").split(" ").map(w=>w[0]).slice(0,2).join("");
const av=m=>`<div class="av" style="background:hsl(${m.id*47%360} 60% 88%);color:hsl(${m.id*47%360} 55% 25%)">${ini(m.n)}</div>`;
const key=()=>role==="student"?"student":"m"+mentorAs;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2600)}
function notify(to,t){notes.unshift({to,t,read:false})}

function render(){
  $("#seg").innerHTML=[["student","Student"],["mentor","Mentor"]].map(([r,l])=>`<button class="${role===r?"on":""}" aria-pressed="${role===r}" onclick="setRole('${r}')">${l}</button>`).join("");
  const un=notes.filter(n=>n.to===key()&&!n.read).length;
  $("#bell").innerHTML="Alerts"+(un?`<b>${un}</b>`:"");
  $("#panel").classList.remove("open");
  $("#nav").innerHTML=[["find","Find mentors"],["req",role==="student"?"My requests":"Inbox"]].map(([v,l])=>`<button class="${view===v?"on":""}" onclick="go('${v}')">${l}</button>`).join("");
  $("#main").innerHTML=view==="find"?findView():reqView();
  if(view==="find")drawList();
}
function setRole(r){role=r;render()}
function go(v){view=v;render()}
function togglePanel(){
  const p=$("#panel"),mine=notes.filter(n=>n.to===key());
  p.innerHTML=mine.length?mine.map(n=>`<p>${esc(n.t)}</p>`).join(""):"<p>No alerts yet. You'll see request updates here.</p>";
  p.classList.toggle("open");
  if(p.classList.contains("open")){mine.forEach(n=>n.read=true);$("#bell").innerHTML="Alerts"}
}

function findView(){
  return `<section class="hero">
    <h1>Find the person who has already done what you're trying to do.</h1>
    <p>Search by skill or goal, pick a mentor, and send a request. They reply with a yes or a no.</p>
    <input class="search" id="q" value="${esc(q)}" placeholder="What do you need help with? Try React or thesis" aria-label="Search mentors" oninput="q=this.value;drawList()">
    <div class="chips">${CATS.map(c=>`<button class="chip ${cat===c?"on":""}" onclick="cat='${c}';render()">${c}</button>`).join("")}</div>
  </section><div class="grid" id="list"></div>`;
}
function drawList(){
  const s=q.trim().toLowerCase();
  const list=M.filter(m=>(cat==="All"||m.c===cat)&&(!s||[m.n,m.t,m.b,...m.s].join(" ").toLowerCase().includes(s)));
  $("#list").innerHTML=list.length?list.map(m=>`<article class="card">
    <div class="top">${av(m)}<div><h3>${esc(m.n)}</h3><div class="sub">${esc(m.t)}</div></div></div>
    <div class="tags">${m.s.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
    <p class="bio">${esc(m.b)}</p>
    <div class="meta"><span>★ ${m.r} · ${m.y} yrs · ${esc(m.a)}</span></div>
    ${role==="student"?`<button class="btn" onclick="openReq(${m.id})">Request a session</button>`:`<div class="sub">Switch to Student to send requests.</div>`}
  </article>`).join(""):`<div class="empty">No mentors match "${esc(q)}"${cat!=="All"?` in ${cat}`:""}. Try a broader skill or clear the category.</div>`;
}

function openReq(id){
  const m=mm(id),d=$("#dlg");
  d.innerHTML=`<h2>Request a session</h2><div class="top" style="margin-top:12px">${av(m)}<div><strong>${esc(m.n)}</strong><div class="sub">${esc(m.t)}</div></div></div>
  <label for="rt">What do you want help with?</label><input class="f" id="rt" value="${esc(q)}" placeholder="e.g. Review my resume">
  <label for="rm">Tell them a bit more</label><textarea class="f" id="rm" rows="3" placeholder="Your level, what you've tried, what you want to leave with"></textarea>
  <label for="rw">When are you free?</label><input class="f" id="rw" placeholder="${esc(m.a)} works for them">
  <p class="err" id="er"></p>
  <div class="acts"><button class="btn" onclick="sendReq(${id})">Send request</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;
  d.showModal();
}
function sendReq(id){
  const t=$("#rt").value.trim();
  if(!t){$("#er").textContent="Add a topic so the mentor knows what to expect.";$("#rt").focus();return}
  const m=mm(id);
  reqs.unshift({id:nid++,m:id,by:"You",topic:t,msg:$("#rm").value.trim(),when:$("#rw").value.trim()||"Flexible",st:"pending"});
  notify("m"+id,`New request from You: ${t}`);
  $("#dlg").close();view="req";render();toast(`Request sent to ${m.n}`);
}

function reqView(){
  const st=role==="student";
  const list=reqs.filter(r=>st?r.by==="You":r.m===mentorAs);
  const pick=st?"":`<label for="ms">Viewing inbox for</label><select class="f" id="ms" style="max-width:320px" onchange="mentorAs=+this.value;render()">${M.map(m=>`<option value="${m.id}" ${m.id===mentorAs?"selected":""}>${esc(m.n)}</option>`).join("")}</select>`;
  return `<section class="sec"><h2>${st?"My requests":"Inbox"}</h2><div class="sub">${st?"Track every request you've sent.":"Accept or decline requests from students."}</div>${pick}
  ${list.length?list.map(r=>rowHtml(r,st)).join(""):`<div class="row empty" style="text-align:center">${st?`No requests yet. Find a mentor and send your first request.<div class="acts" style="justify-content:center"><button class="btn" onclick="go('find')">Find mentors</button></div>`:"No requests yet. Students who need your skills will show up here."}</div>`}</section>`;
}
const LBL={pending:"Waiting for reply",accepted:"Accepted",declined:"Declined",completed:"Completed"};
function rowHtml(r,st){
  const m=mm(r.m);
  let a="";
  if(!st&&r.st==="pending")a=`<button class="btn" onclick="decide(${r.id},'accepted')">Accept</button><button class="btn bad" onclick="decide(${r.id},'declined')">Decline</button>`;
  if(st&&r.st==="pending")a=`<span class="sub">Switch to Mentor view to reply as ${esc(m.n)}.</span>`;
  if(st&&r.st==="accepted")a=`<button class="btn" onclick="openReview(${r.id})">Mark completed and review</button>`;
  if(r.st==="completed")a=`<span class="sub">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)} ${esc(r.review||"")}</span>`;
  return `<div class="row"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${esc(r.topic)}</h3><span class="pill ${r.st}">${LBL[r.st]}</span></div>
  <div class="sub">${st?"To "+esc(m.n):"From "+esc(r.by)} · Free: ${esc(r.when)}</div>${r.msg?`<p style="margin:10px 0 0">${esc(r.msg)}</p>`:""}<div class="acts">${a}</div></div>`;
}
function decide(id,s){
  const r=reqs.find(x=>x.id===id);r.st=s;
  if(r.by==="You")notify("student",`${mm(r.m).n} ${s} your request: ${r.topic}`);
  render();toast(s==="accepted"?"Request accepted":"Request declined");
}
function openReview(id){
  stars=0;const d=$("#dlg");
  d.innerHTML=`<h2>How did it go?</h2><p class="sub">Your review helps other students choose.</p>
  <div class="stars" id="st" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button aria-label="${n} star${n>1?"s":""}" onclick="setStars(${n})">★</button>`).join("")}</div>
  <label for="rc">Comment</label><textarea class="f" id="rc" rows="3" placeholder="What was most useful?"></textarea>
  <p class="err" id="er"></p>
  <div class="acts"><button class="btn" onclick="sendReview(${id})">Submit review</button><button class="btn alt" onclick="$('#dlg').close()">Cancel</button></div>`;
  d.showModal();
}
function setStars(n){stars=n;[...$("#st").children].forEach((b,i)=>b.classList.toggle("on",i<n))}
function sendReview(id){
  if(!stars){$("#er").textContent="Pick a star rating first.";return}
  const r=reqs.find(x=>x.id===id);r.st="completed";r.rating=stars;r.review=$("#rc").value.trim();
  notify("m"+r.m,`You received a ${stars}-star review for: ${r.topic}`);
  $("#dlg").close();render();toast("Review submitted");
}
$("#dlg").addEventListener("click",e=>{if(e.target===e.currentTarget)e.currentTarget.close()});
render();
</script>
</body>
</html>
